<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/020/975/665/original/zomato-logo-zomato-icon-transparent-free-png.png">
    <link rel="stylesheet" type="text/css" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Zomato</title>
</head>

<body>

  <div class="bgcontainer">
    
    <div class="d-flex flex-row justify-content-between top-bar">
     <a href="#" class="app-link">Get the App</a>

     <div class="button-up">
      <button  class="btn btn-light btn-outline-danger border-0" style="margin-right: 20px; margin-top: 20px;">Login</button>
      <button class="btn btn-light btn-outline-danger border-0" style="margin-left: 30px; margin-top: 20px;">SignUp</button>
     </div>

    </div>
    
    <div class="text-1">
      <h6 class="logo">zomato</h6>
      <p>Discover the best food & drinks in Surat</p>
    </div>

    <div class="search-container">

      <div class="detectlocation">
        <i class="fa-solid fa-location-dot"></i>
        <input type="text" placeholder="Hyderabad"/>
        <i class="fa-solid fa-caret-down caret-down"></i>
      </div>

      <div class="line"> |</div>

      <div clss="search-item">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="search for restaurant, cuisine or a dish">
      </div>

    </div>

  </div>


    
  <div class="d-flex flex-row justify-content-around cards">

    <div class="card-below">
      <img src="https://kikkomanusa.com/foodservice/wp-content/uploads/sites/2/2021/10/22597_bibimbap-e1681092352206.jpg" style="width: 20vw;height: 20vh;">
      <p style="text-align:center;">Order food online</p>
    </div>

    <div class="card-below">
      <img src="https://zomatohome.netlify.app/images/order2.webp"  style="width: 20vw;height: 20vh;">
      <p style="text-align:center;">Go out for a meal</p>
    </div>

    <div class="card-below">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKduSV2BJEvi87291369I6BlqLtDeVNUs7Ng&s" style="width: 20vw;height: 20vh;">
      <p style="text-align:center;">Night Life & Clubs</p>
    </div>

    <div class="card-below">
      <img src="https://zomatohome.netlify.app/images/order4.webp" style="width: 20vw;height: 20vh;">
      <p style="text-align:center;">Zomato pro</p>
    </div>

  </div>
